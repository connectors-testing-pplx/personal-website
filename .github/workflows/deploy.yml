name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p _site
          cp -r index.html css js assets _site/ 2>/dev/null || true
          # Copy static assets that exist (resume PDF, etc.)
          for f in *.pdf *.png *.ico; do
            [ -f "$f" ] && cp "$f" _site/
          done
          # Activate the CNAME only once a real custom domain replaces the placeholder.
          # This keeps the default <user>.github.io URL live until a domain is configured.
          if [ -f CNAME ] && ! grep -qi "your-custom-domain.com" CNAME; then
            cp CNAME _site/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
